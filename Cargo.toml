[workspace]
resolver = "2"
members = [
    "crates/mem-core",
    "crates/mem-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
okm-core = { git = "https://github.com/orbsh/okm", branch = "main", features = ["fjall", "schema-serde", "parquet"] }
okm-derive = { git = "https://github.com/orbsh/okm", branch = "main" }
okm-vector = { git = "https://github.com/orbsh/okm", branch = "main" }
fjall = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kdl = "4"
thiserror = "2"
tracing = "0.1"
tempfile = "3"
tar = "0.4"
zstd = "0.13"

axum = "0.8"
tokio = { version = "1", features = ["full"] }

# TEMPORARY (verification only): okm's restore mirrors are not pushed yet.
# Remove this block and re-lock (`cargo update -p okm-core -p okm-derive -p okm-vector`)
# once they are on origin/main.
[patch."https://github.com/orbsh/okm"]
okm-core = { path = "../okm/okm-core" }
okm-derive = { path = "../okm/okm-derive" }
okm-vector = { path = "../okm/okm-vector" }
