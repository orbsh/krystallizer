[workspace]
resolver = "2"
members = [
    "crates/mem-core",
    "crates/mem-ffi",
    "crates/mem-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
okm = { path = "../okm/okm" }
okm-derive = { path = "../okm/okm-derive" }
fjall = "2"
arroy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kdl = "4"
thiserror = "2"
tracing = "0.1"
tempfile = "3"

pyo3 = { version = "0.24", features = ["extension-module"] }
maturin = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
