[workspace]
resolver = "2"
members = [
    "crates/mem-core",
    "crates/mem-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
okm-core = { git = "https://github.com/orbsh/okm", branch = "main", features = ["fjall", "schema-serde", "parquet"] }
okm-derive = { git = "https://github.com/orbsh/okm", branch = "main" }
okm-vector = { git = "https://github.com/orbsh/okm", branch = "main" }
fjall = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kdl = "4"
thiserror = "2"
tracing = "0.1"
tempfile = "3"
tar = "0.4"
zstd = "0.13"

axum = "0.8"
tokio = { version = "1", features = ["full"] }

[workspace.lints.clippy]
# The standing rule: a fallible step returns `Result`, an absent value returns
# `Option`, and neither is short-circuited by a panic. deny (not forbid) so a
# genuinely impossible state can carry a narrow, commented allow.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
