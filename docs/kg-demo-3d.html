<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GraphRAG 3D 知识图谱 · 流式追加演示</title>
    <!--
        依赖两个文件：
          1) 3d-force-graph（vasturiano/3d-force-graph v1.80.1，WebGL/three.js，
             UMD 包自带 three.js 并暴露全局 ForceGraph3D）
             加载顺序：CDN（unpkg，钉版本）→ 失败则回落 docs/vendor/3d-force-graph.js。
             仓库不背这个包（docs/vendor 在 .gitignore 里），clone 出来靠 CDN，本机离线靠副本。
          2) viz-style.js —— 类型 → 颜色的视觉惯例表（节点按 kind、边按谓词 kind）。
             单独存一份是为了让"看图的惯例"只有一个来源：页面从它取色、由它生成图例。
             file:// 下 fetch 本地 JSON 会被 CORS 拦掉，所以约定表是 JS 模块。

        文字标签的做法：库本身只给悬停 tooltip（nodeLabel / linkLabel），没有常显文字。
        这里用一层 pointer-events:none 的 HTML 覆盖层自己画：每帧把节点坐标（边取中点）
        用相机矩阵自己投影成屏幕像素（P·V，见下面的 project()），再摆一个 div。
        不用库自带的 graph2ScreenCoords()：实测它给的值与相机不符（视野内的点被投到 x=-3564，
        相机 fit 之后也照旧），所以那套投影被弃用。
        定位跑在自己的 requestAnimationFrame 循环里，**不挂 onEngineTick** ——
        库的物理收敛后会自停，挂在 tick 上的定位会冻住，后半段节点就没有标签了（踩过）。
        好处是文字清晰、颜色跟着类型走；代价是逐帧 DOM 写入，适合小图。
        大图（万级）应改成 three.js 精灵文字，或只保留悬停显示。
        已知近似：相机背后的节点也可能被投影进画布，所以这里只做"超出视口就隐藏"。

        物理不许自动停：.d3AlphaMin(0)。默认 alpha 衰减到 alphaMin(0.001) 后引擎自停，
        而 d3ReheatSimulation() 只把 alpha 设回 1、不重启引擎 —— 于是流式后半段进来的节点
        永不参与布局（实测：20 个数据包只布局/标注了前 6 个）。alphaMin=0 让模拟一直跑，
        拖拽时的力反馈也是实时的。

        边端点自己先解析、按批投递：
          graphData.links 是引擎**按引用**持有的数组，push 一条端点还是字符串的边，
          就是赶在引擎下一次更新之前把它塞进了物理引擎；而库的一个更新帧里物理 tick
          先跑、端点解析后跑，那一帧的 tick 于是读到字符串端点抛 TypeError，异常又落在
          _animationCycle 里 —— 它最后一句才是 requestAnimationFrame 续帧，抛了就不再续：
          画布从此冻住，节点铺满、边一条也不画（踩过）。所以每批投递前自己把端点换成
          节点对象，并且一批一次 graphData()，不是一包一次。细节见文件末尾 applyBatch 上面。

        数值属性的表达（都是**屏幕像素**，用 PX_PER_UNIT 折成世界单位的）：
          节点直径 ← weight 归并 4 档：默认 2px、每级 +2px → 2 / 4 / 6 / 8px
          边宽     ← strength 两档：默认 1px、每级 +1px → 1 / 2px
        两条阶梯都是**线性**的（加常数），不是乘方的：每级翻倍那条路末档是默认档的 8 倍，
        在这份数据上读起来是"一个大球带一堆点"，线性阶梯只差 4 倍。
        基准是"默认相机距离下的像素"（打开时算一次），滚轮放大时尺寸与世界一起变大。
        想换成别的字段，只改 nodeDiaPx / edgeWidth 这两处映射。
    -->
    <style>
        :root {
            --panel-bg: rgba(2, 6, 23, 0.85);
            --panel-border: rgba(30, 41, 59, 0.8);
            --label: #64748b;
            --label-strong: #94a3b8;
            --text: #e2e8f0;
            --accent: #818cf8;
            --node-count: #34d399;
            --link-count: #38bdf8;
            --warn: #f59e0b;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            overflow: hidden;
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
            background: radial-gradient(circle at center, #0b0f19 0%, #020408 100%);
            user-select: none;
        }

        /* 3D 画布容器：铺满视口 */
        #3d-graph { position: absolute; inset: 0; }
        /* 隐藏 3D 库自带的加载遮罩 */
        .graph-info { display: none; }

        /* 常显文字标签层（自己画的，见文件头说明） */
        #labels {
            position: absolute;
            inset: 0;
            z-index: 10;
            overflow: hidden;
            pointer-events: none;
        }
        .lbl {
            position: absolute;
            top: 0;
            left: 0;
            white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 0 2px rgba(0, 0, 0, 0.9);
        }
        .lbl-node { font-size: 11px; font-weight: 600; }
        .lbl-edge { font-size: 9px; opacity: 0.85; }

        /* 左侧悬浮控制台（模拟后端驱动端：外壳固定，拓扑全部流式注入） */
        aside.panel {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 50;
            width: 22.5rem;
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid var(--panel-border);
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .panel-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .pulse {
            width: 0.625rem;
            height: 0.625rem;
            border-radius: 9999px;
            background: #6366f1;
            animation: pulse 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }
        .panel-title h1 {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.025em;
            color: var(--accent);
        }
        .panel-desc {
            margin: 0 0 1rem;
            font-size: 0.75rem;
            line-height: 1.625;
            color: var(--label-strong);
        }
        .panel-desc strong { color: var(--text); }

        .metrics {
            margin-bottom: 1rem;
            padding: 0.75rem;
            border: 1px solid #0f172a;
            border-radius: 0.75rem;
            background: rgba(0, 0, 0, 0.6);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.6875rem;
        }
        .metrics .row {
            display: flex;
            justify-content: space-between;
            padding: 0.1875rem 0;
        }
        .metrics .head {
            display: flex;
            justify-content: space-between;
            padding-bottom: 0.375rem;
            margin-bottom: 0.375rem;
            border-bottom: 1px solid #0f172a;
        }
        .metrics .head span { color: var(--label); }
        .metrics .label { color: var(--text); }
        #node-count { color: var(--node-count); font-weight: 700; }
        #link-count { color: var(--link-count); font-weight: 700; }
        .metrics .stream {
            padding-top: 0.375rem;
            margin-top: 0.375rem;
            border-top: 1px solid #0f172a;
            color: var(--label);
            font-size: 0.625rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .metrics .stream .dot { color: var(--warn); animation: pulse 1.8s infinite; }
        .metrics .stream.error { color: #fca5a5; }

        /* 图例：内容由 viz-style.js 生成，不在这里硬编码 */
        .legend {
            margin-bottom: 1rem;
            padding: 0.625rem;
            border: 1px solid #0f172a;
            border-radius: 0.5rem;
            background: rgba(15, 23, 42, 0.4);
            font-size: 0.625rem;
            line-height: 1.6;
            color: var(--label);
        }
        .legend h2 {
            margin: 0 0 0.25rem;
            font-size: 0.625rem;
            font-weight: 600;
            color: var(--label-strong);
        }
        .legend .group + .group { margin-top: 0.5rem; }
        .legend .item { display: flex; align-items: center; gap: 0.375rem; }
        .legend .swatch { width: 0.5rem; height: 0.5rem; border-radius: 9999px; flex: none; }
        .legend .bar { width: 0.75rem; height: 2px; border-radius: 2px; flex: none; }

        .guide {
            padding: 0.625rem;
            border: 1px solid #0f172a;
            border-radius: 0.5rem;
            background: rgba(15, 23, 42, 0.4);
            font-size: 0.625rem;
            line-height: 1.5;
            color: var(--label);
        }
        .guide .guide-head {
            margin-bottom: 0.25rem;
            font-weight: 600;
            color: var(--label-strong);
        }
    </style>
</head>
<body>

    <aside class="panel">
        <div class="panel-title">
            <div class="pulse"></div>
            <h1>GraphRAG 3D 知识图谱内核</h1>
        </div>
        <p class="panel-desc">
            当前处于<strong>哑终端（Dumb Terminal）</strong>模式。前端外壳一成不变，所有实体、关系及 Schema 拓扑全部由后端流式注入。
        </p>

        <!-- 实时指令流水监视器 -->
        <div class="metrics">
            <div class="head">
                <span>PROPERTIES</span>
                <span>METRICS</span>
            </div>
            <div class="row">
                <span class="label">实体节点 (Entities):</span>
                <span id="node-count">0</span>
            </div>
            <div class="row">
                <span class="label">语义关系 (Relations):</span>
                <span id="link-count">0</span>
            </div>
            <div class="stream">
                <span class="dot">●</span> <span id="stream-log">正在等待后端握手...</span>
            </div>
        </div>

        <!-- 图例（由 viz-style.js 生成：颜色与类型的对应表是那一个文件） -->
        <div class="legend" id="legend"></div>

        <!-- 交互指南 -->
        <div class="guide">
            <div class="guide-head">🎮 空间交互：</div>
            <div>• 鼠标左键拖拽：旋转三维宇宙</div>
            <div>• 鼠标滚轮：放大 / 缩小</div>
            <div>• 鼠标右键拖拽：平移</div>
            <div>• 悬停节点 / 边：显示属性</div>
            <div>• 点击节点：触发后端实体下钻事件</div>
        </div>
    </aside>

    <!-- 用于挂载 WebGL 3D Canvas 的全屏容器 -->
    <div id="3d-graph"></div>
    <!-- 常显文字标签层（每帧投影定位，见文件头） -->
    <div id="labels"></div>

    <!-- 依赖 1：3d-force-graph。CDN 优先，本机离线时回落到 vendor/ -->
    <script src="https://unpkg.com/3d-force-graph@1.80.1/dist/3d-force-graph.min.js"></script>
    <script>
        // 回落分支：仓库不背这个包（docs/vendor 在 .gitignore 里），
        // clone 出来走 CDN；本机离线时用 docs/vendor/3d-force-graph.js 那份副本。
        if (typeof ForceGraph3D !== 'function') {
            document.write('<script src="vendor/3d-force-graph.js"><\/script>');
        }
    </script>
    <!-- 依赖 2：视觉惯例表（类型 → 颜色；节点与边各一张） -->
    <script src="viz-style.js"></script>
    <script>
        // ---- 面板输出：既是日志行，也是这个演示的自诊断面 ----------------
        const logEl = document.getElementById('stream-log');
        const setLog = (text, isError) => {
            logEl.textContent = text;
            logEl.parentElement.classList.toggle('error', Boolean(isError));
        };
        // 页面内的错误直接落到面板上，而不是只进控制台（打不开时一眼能看出原因）
        window.addEventListener('error', (e) => setLog(`渲染错误: ${e.message}`, true));
        window.addEventListener('unhandledrejection', (e) => setLog(`渲染错误: ${e.reason}`, true));

        if (typeof ForceGraph3D !== 'function') {
            setLog('缺 3d-force-graph —— 无法渲染（CDN 不可达，且本目录下没有 vendor/3d-force-graph.js）', true);
        } else {
            boot();
        }

        function boot() {
        // ---- 视觉惯例：取色与图例都从 viz-style.js 来 ----------------------
        const STYLE = window.K10R_VIZ_STYLE || {};
        const NODE_KINDS = STYLE.nodeKinds || {};
        const EDGE_KINDS = STYLE.edgeKinds || {};
        const FALLBACK = STYLE.fallback || { node: '#cbd5e1', edge: '#64748b' };
        const nodeColor = (kind) => (NODE_KINDS[kind] && NODE_KINDS[kind].color) || FALLBACK.node;
        const edgeColor = (kind) => (EDGE_KINDS[kind] && EDGE_KINDS[kind].color) || FALLBACK.edge;
        const nodeKindText = (kind) => (NODE_KINDS[kind] && NODE_KINDS[kind].label) || `未登记 (${kind})`;
        const edgeKindText = (kind) => (EDGE_KINDS[kind] && EDGE_KINDS[kind].label) || `未登记 (${kind})`;

        // 图例由约定表生成：加一类只改 viz-style.js，这里不用动
        const legend = document.getElementById('legend');
        const legendGroup = (title, entries, isEdge) => {
            const box = document.createElement('div');
            box.className = 'group';
            const h = document.createElement('h2');
            h.textContent = title;
            box.appendChild(h);
            entries.forEach(([kind, def]) => {
                const row = document.createElement('div');
                row.className = 'item';
                const sw = document.createElement('span');
                sw.className = isEdge ? 'bar' : 'swatch';
                sw.style.background = def.color;
                const tx = document.createElement('span');
                tx.textContent = def.label;
                row.append(sw, tx);
                box.appendChild(row);
            });
            legend.appendChild(box);
        };
        legendGroup('节点类型', Object.entries(NODE_KINDS), false);
        legendGroup('关系类型', Object.entries(EDGE_KINDS), true);

        // ---- 数据容器 -------------------------------------------------------
        const graphData = { nodes: [], links: [] };

        // 1. 实例化 3D 图谱渲染引擎
        const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
            .graphData(graphData)
            .backgroundColor('rgba(0,0,0,0)')   // 透明画布，衬托 CSS 渐变底色
            .showNavInfo(false)                 // 相机是库默认的 trackball：左键旋转 / 右键平移 / 滚轮缩放
            .d3AlphaMin(0)                      // 物理不许自动停：默认 alpha 衰减到 alphaMin 后引擎自停，
                                                // 而 d3ReheatSimulation() 只把 alpha 设回 1、并不重启引擎 ——
                                                // 后果是流式后半段进来的节点永不参与布局（本版实测踩过）
            .nodeColor(n => nodeColor(n.kind))  // 类型 → 颜色（惯例表）
            .nodeVal(n => Math.pow(nodeRadiusWorld(n), 3))   // 尺寸见下面「屏幕像素 → 世界单位」：
                                                // 库的球半径 = ∛nodeVal × nodeRelSize，nodeRelSize 取 1，
                                                // 所以这里直接给「半径（世界单位）的立方」
            .nodeRelSize(1)                     // 固定 1：半径 = ∛nodeVal（世界单位）
            .nodeLabel(n => tooltipNode(n))     // 悬停显示属性
            .linkColor(l => edgeColor(l.kind))  // 关系类型 → 线色
            .linkWidth(l => edgeWidth(l))       // 关系强度 → 线粗（两档 1px / 2px，见下面 PX_PER_UNIT）
            .linkOpacity(0.9)                   // 库默认 0.2：细圆柱在深底上几乎看不见（实测被批"看不见边"）
            .linkLabel(l => tooltipEdge(l))     // 悬停显示属性
            .linkDirectionalParticles(l => Math.max(1, Math.round((l.strength || 1) / 2)))  // 强度 → 粒子数
            .linkDirectionalParticleSpeed(0.004)
            .linkDirectionalParticleColor(l => edgeColor(l.kind));

        // 力参数与相机是一对：图摊得越大，屏幕上的节点/边越小（它们的世界尺寸由下面的
        // PX_PER_UNIT 从屏幕像素折来，与力参数无关；力参数只决定图摊多大）。
        // 实测这套数据（38 点 / 48 边）收敛后：link 120 / charge -200 下世界半径约 ±750、
        // 边均长约 152 单位；相机距离取 CAM_DIST = 1660，图高占视口约 80%（三次全新加载实测
        // 80 / 81 / 80%，顶不出去），边均长约 90px —— 整张图进视野，边看得清清楚楚。
        // （早先那组 link 25 / charge -40 / 相机 2516 是照"没收敛就冻住"的状态量的：边均长
        //   只剩 44 单位、整张图缩成 120×170px 一小团，看着是个毛球。）
        const CAM_DIST = 1660;                        // 相机距离（世界单位），见上
        Graph.d3Force('charge').strength(-200);
        Graph.d3Force('link').distance(120);
        // 斜 45° 视角：默认视角沿 z 轴正对原点，深度会被压平，看着像 2D。
        // (0.636, 0.437, 0.636) 是原来那个 (1600,1100,1600) 的方向（长度归一），乘 CAM_DIST 得相机位。
        Graph.cameraPosition({ x: CAM_DIST * 0.636, y: CAM_DIST * 0.437, z: CAM_DIST * 0.636 });

        // ---- 屏幕像素 → 世界单位 ------------------------------------------------
        // 尺寸按屏幕像素定（节点默认 2px、边默认 1px），而库的尺寸全是世界单位，所以先算
        // "1 世界单位 = 多少像素"再折回去。基准取打开时的视口高度 + 相机距离 CAM_DIST：
        // 于是这是"默认相机距离下的 2px"，滚轮放大时尺寸和世界一起变大。
        // （改成跟随实时相机距离就变成屏幕像素恒定了 —— 那是另一种取向，别混。）
        const PX_PER_UNIT = window.innerHeight /
            (2 * CAM_DIST * Math.tan(Graph.camera().fov * Math.PI / 360));

        // 节点直径的阶梯：默认 2px，每级 +2px —— 线性增长，不是乘方（原来每级翻倍到 16px，
        // 末档是默认档的 8 倍）。weight（中心度）3..10 归并成 4 档：
        //   3–4 → 2px   5–6 → 4px   7–8 → 6px   9–10 → 8px
        const nodeTier = (weight) => Math.max(0, Math.min(3, Math.floor(((weight || 3) - 3) / 2)));
        const nodeDiaPx = (weight) => 2 + 2 * nodeTier(weight);
        const nodeRadiusWorld = (n) => nodeDiaPx(n.weight) / 2 / PX_PER_UNIT;

        // 线宽两档：默认 1px，每级 +1px（强度 ≥4 的 2px）。库把 linkWidth 当圆柱**直径**
        // （内部 radius = width/2），所以这里填的数就是屏幕上的线宽。
        function edgeWidth(link) {
            return ((link.strength || 2) >= 4 ? 2 : 1) / PX_PER_UNIT;
        }

        // 沿边的粒子点点（个数编码强度）也跟着折成 1px —— 线宽降到 1px 之后，粒子若还是
        // 世界单位 2.5，点点会比线还粗，喧宾夺主。这里同样按屏幕像素给（1px）。
        Graph.linkDirectionalParticleWidth(1 / PX_PER_UNIT);

        // 悬停属性框
        const kv = (k, v) => `<div style="display:flex;justify-content:space-between;gap:1rem"><span style="color:#64748b">${k}</span><span style="color:#cbd5e1;font-family:ui-monospace,monospace">${v}</span></div>`;
        const tooltipNode = (n) => `
            <div style="background:rgba(2,6,23,.95);border:1px solid #1e293b;padding:.7rem;border-radius:.75rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.8);font-family:system-ui,sans-serif;font-size:.7rem;line-height:1.6;min-width:12rem">
                <div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.35rem">
                    <span style="width:.5rem;height:.5rem;border-radius:9999px;background:${nodeColor(n.kind)}"></span>
                    <span style="font-weight:700;color:#fff">${n.name}</span>
                </div>
                ${kv('类型', nodeKindText(n.kind))}
                ${kv('中心度', n.weight)}
                ${n.refs != null ? kv('被引用', n.refs) : ''}
                ${n.community ? kv('社区', n.community) : ''}
            </div>`;
        const tooltipEdge = (l) => `
            <div style="background:rgba(2,6,23,.95);border:1px solid #1e293b;padding:.7rem;border-radius:.75rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.8);font-family:system-ui,sans-serif;font-size:.7rem;line-height:1.6;min-width:12rem">
                <div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.35rem">
                    <span style="width:.75rem;height:2px;border-radius:2px;background:${edgeColor(l.kind)}"></span>
                    <span style="font-weight:700;color:#fff">${l.rel}</span>
                </div>

        // （库只有悬停 tooltip，没有常显文字；这里按 graph2ScreenCoords 投影摆 div）
        const layer = document.getElementById('labels');
        const labelCache = new Map();
        const labelEl = (key, text, cls) => {
            let el = labelCache.get(key);
            if (!el) {
                el = document.createElement('div');
                el.className = `lbl ${cls}`;
                layer.appendChild(el);
                labelCache.set(key, el);
            }
            if (el.textContent !== text) el.textContent = text;
            return el;
        };
        // 自己算投影：库的 graph2ScreenCoords() 在这版里给的值与相机不一致（实测：一个明明
        // 在视野内的节点被投影到 x=-3564，camera 已 fit 也照旧），所以不信它。
        // 直接用相机矩阵做 P·V·[x,y,z,1]（three 的 elements 是列主序），不需要全局 THREE。
        const v3 = [0, 0, 0, 0];
        const project = (x, y, z) => {
            const cam = Graph.camera();
            const m = cam.matrixWorldInverse.elements;
            v3[0] = m[0] * x + m[4] * y + m[8] * z + m[12];
            v3[1] = m[1] * x + m[5] * y + m[9] * z + m[13];
            v3[2] = m[2] * x + m[6] * y + m[10] * z + m[14];
            v3[3] = m[3] * x + m[7] * y + m[11] * z + m[15];
            const p = cam.projectionMatrix.elements;
            const cx = p[0] * v3[0] + p[4] * v3[1] + p[8] * v3[2] + p[12] * v3[3];
            const cy = p[1] * v3[0] + p[5] * v3[1] + p[9] * v3[2] + p[13] * v3[3];
            const cw = p[3] * v3[0] + p[7] * v3[1] + p[11] * v3[2] + p[15] * v3[3];
            if (!cw) return null;                       // 相机正后方/退化
            return {
                x: (cx / cw * 0.5 + 0.5) * layer.clientWidth,
                y: (-cy / cw * 0.5 + 0.5) * layer.clientHeight,
                behind: cw <= 0,                        // 透视除法对背后的点是镜像的
            };
        };
        const placeLabel = (el, p, dy) => {
            // 视口外、以及相机背后的点，都藏起来
            if (!p || p.behind || !isFinite(p.x) || !isFinite(p.y) ||
                p.x < -40 || p.y < -40 || p.x > layer.clientWidth + 40 || p.y > layer.clientHeight + 40) {
                el.style.display = 'none';
                return;
            }
            el.style.display = '';
            el.style.transform = `translate(-50%,-50%) translate(${p.x}px, ${p.y + dy}px)`;
        };

        // 自驱 requestAnimationFrame 循环，而不是挂 onEngineTick：引擎在物理收敛后停止 tick，
        // 挂在 tick 上的定位会冻住（流式后半段的节点根本不会出现标签）。
        // 这个循环与物理状态无关，永远跟着节点位置走。
        const placeAllLabels = () => {
            graphData.nodes.forEach(n => {
                const el = labelEl(`n:${n.id}`, n.name, 'lbl-node');
                el.style.color = nodeColor(n.kind);
                placeLabel(el, project(n.x, n.y, n.z), 16);
            });
            graphData.links.forEach((l, i) => {
                const s = l.source, t = l.target;
                if (!s || typeof s !== 'object' || !t || typeof t !== 'object') return;
                const el = labelEl(`e:${i}`, l.rel, 'lbl-edge');
                el.style.color = edgeColor(l.kind);
                const ps = project(s.x, s.y, s.z), pt = project(t.x, t.y, t.z);
                // 屏幕上太短的边不放文字：86 条标签挤在一个视野里会糊成一团，

                if (!ps || !pt || ps.behind || pt.behind ||

                    el.style.display = 'none';
                    return;
                }
                placeLabel(el, project((s.x + t.x) / 2, (s.y + t.y) / 2, (s.z + t.z) / 2), 0);
            });

        const applyBatch = (batch) => {
            const pendingLinks = [];
            let addedNodes = 0;
            batch.packets.forEach(p => {
                if (p.op === 'add_node') {
                    graphData.nodes.push(p.node);
                    nodeById.set(p.node.id, p.node);
                    addedNodes++;
                } else {
                    pendingLinks.push(p.link);
                }
            });
            const { ok, dropped } = resolveLinks(pendingLinks);

            // 整批一次推进引擎，而不是一包一次
            Graph.graphData(graphData);
            // 局部加热物理引擎：新进的点平滑扩散，旧节点继续受力（拖拽也走同一套力反馈）
            Graph.d3ReheatSimulation();

            refreshMetrics(`${batch.label}：+${addedNodes} 实体 / +${ok} 关系`);
            if (dropped) setLog(`${batch.label}：${dropped} 条边的端点不在图上 —— 包清单有笔误`, true);
        };

        // 包清单 → 批次（分界标记带 label）
        const kgStreamBatches = [];
        kgStreamPackets.forEach(p => {
            if (p.op === 'batch') {
                kgStreamBatches.push({ label: p.label, packets: [] });
            } else {
                if (!kgStreamBatches.length) throw new Error('包清单的第一项必须是 batch 标记');
                kgStreamBatches[kgStreamBatches.length - 1].packets.push(p);
            }
        });

        let currentBatchIndex = 0;

        const executeStreamStep = () => {
            if (currentBatchIndex >= kgStreamBatches.length) {
                // 计数直接从数据里取，不手写数字（手写的会漂）
                refreshMetrics(`>>> 文档图谱注入完成：${graphData.nodes.length} 个节点 / ${graphData.links.length} 条关系（ADR / 文档 / crate / 表 / 面 / 消费方 / 概念 / 欠账）。`);
                return;
            }

            applyBatch(kgStreamBatches[currentBatchIndex]);
            currentBatchIndex++;
            // 分批步进：每批 800ms。批数由包清单的 batch 标记决定，总数不写死在这里（会漂）
            setTimeout(executeStreamStep, 800);
        };

        // 延迟 1 秒后，启动流式图谱对接口
        setTimeout(() => {
            setLog("后端已握手，开始流式注入拓扑...");
            executeStreamStep();
        }, 1000);
        }
    </script>
