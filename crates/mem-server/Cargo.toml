[package]
name = "mem-server"
version.workspace = true
edition.workspace = true
license.workspace = true

# The binary is the PROJECT's name, not the crate's: a process manager should show
# `krystallizer`, and the crate keeps the workspace's memory-core/ffi/server family.
[[bin]]
name = "krystallizer"
path = "src/main.rs"

[dependencies]
mem-core = { path = "../mem-core" }
# The lake's writer: the same crate the export boundary uses, so a published file and an
# in-process one cannot disagree about the format (ADR-0014).
okm-lake.workspace = true
axum.workspace = true
tokio.workspace = true
fjall.workspace = true
serde.workspace = true
serde_json.workspace = true
# The remote embedding mode's client (ADR-0003): the HTTP shell owns the
# transport, mem-core owns none.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

[dev-dependencies]
tempfile.workspace = true
parquet = { version = "60", default-features = false, features = ["arrow"] }
arrow = { version = "60" }
bytes = "1"

[lints]
workspace = true
