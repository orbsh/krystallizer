<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>k10r · 事实图</title>
<!--
  The live graph view, served BY mem-server (same origin, ADR-0007's ruling: the
  memory service opens no CORS, so the page cannot live on file://).

  Three things this page exists for, all of them maintenance rather than
  analysis: colour by COMMUNITY (the box the write path put a node in, ADR-0010
  §6), cap what one scope draws (a big scope is not a picture), and click a node
  to see the edges it actually carries.

  It draws what GET /graph/{scope} answers and nothing else: nodes are entities,
  links are facts. No layout is invented here -- the physics is the library's.
-->
<style>
  :root { --bg:#0b1020; --panel:#121a30; --line:#243055; --text:#dbe4ff; --dim:#8b9ac4; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:radial-gradient(circle at 50% 30%,#16224a 0%,var(--bg) 70%); color:var(--text);
    font:13px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif; overflow:hidden; }
  #graph { position:fixed; inset:0; }
  .panel { position:fixed; background:rgba(18,26,48,.92); border:1px solid var(--line); border-radius:10px;
    backdrop-filter:blur(6px); padding:10px 12px; }
  #controls { top:12px; left:12px; width:260px; }
  #controls h1 { margin:0 0 8px; font-size:13px; font-weight:600; letter-spacing:.04em; color:#a9bbf0; }
  .row { display:flex; align-items:center; gap:6px; margin:6px 0; }
  .row label { color:var(--dim); min-width:52px; }
  input[type=number] { width:72px; background:#0d1428; color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:3px 6px; }
  button { background:#1d2a4d; color:var(--text); border:1px solid var(--line); border-radius:6px;
    padding:4px 10px; cursor:pointer; }
  button:hover { background:#26365f; }
  .seg { display:flex; gap:0; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { border:0; border-radius:0; flex:1; background:transparent; }
  .seg button.on { background:#2b3d6b; color:#fff; }
  #stats { color:var(--dim); margin-top:8px; font-variant-numeric:tabular-nums; }
  #detail { top:12px; right:12px; width:300px; max-height:calc(100% - 24px); overflow:auto; display:none; }
  #detail h2 { margin:0 0 6px; font-size:13px; word-break:break-all; }
  #detail .meta { color:var(--dim); margin-bottom:8px; }
  #detail .body { color:var(--text); margin-bottom:8px; line-height:1.55; }
  #detail ul { list-style:none; margin:0; padding:0; }
  #detail li { padding:5px 0; border-top:1px solid var(--line); cursor:pointer; }
  #detail li:hover { color:#fff; }
  #detail .rel { color:#9db2ea; }
  #detail .end { color:var(--text); }
  #detail .w { color:var(--dim); font-variant-numeric:tabular-nums; }
  #msg { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); color:#ff9aa2; }
  #legend { bottom:12px; left:12px; max-width:320px; display:none; }
  #legend .item { display:flex; align-items:center; gap:6px; }
  #legend .sw { width:9px; height:9px; border-radius:50%; }
  /* Labels are DRAWN, not DOM: a few hundred divs re-positioned every frame is
     what makes a 3D view stutter, while one 2D canvas over the WebGL one costs
     a few hundred fillText calls. Short on the canvas, full text on hover. */
  #labels { position:fixed; inset:0; pointer-events:none; z-index:1; }
  .row input[type=checkbox] { accent-color:#4a6bd8; }
  /* The hover card. The library's tooltip is one inline div, so it must be told
     to wrap: a node's content is two or three sentences and a source path, and
     cramming those onto one line is what makes a tooltip unreadable. */
  .scene-tooltip { max-width:340px; white-space:normal; line-height:1.5;
    font:12px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif; text-align:left; }
  .cd-title { font-weight:600; font-size:13px; color:#fff; margin-bottom:2px; }
  .cd-name { color:#8b9ac4; font-size:11px; margin-bottom:6px; word-break:break-all; }
  .cd-body { color:#dbe4ff; margin-bottom:6px; }
  .cd-meta { color:#8b9ac4; font-size:11px; }
  .cd-src { color:#8b9ac4; font-size:11px; margin-top:4px; word-break:break-all; }
  .cd-props { margin-top:6px; padding-top:5px; border-top:1px solid #243055;
    color:#9db2ea; font-size:11px; word-break:break-all; }
  .cd-props span { color:#8b9ac4; }
</style>
</head>
<body>
<div id="graph"></div>
<canvas id="labels"></canvas>

<div class="panel" id="controls">
  <h1>k10r · 事实图</h1>
  <div class="row">
    <label>scope</label>
    <input id="scope" type="number" value="1" min="0">
    <button id="load">载入</button>
  </div>
  <div class="row">
    <label>上限</label>
    <input id="cap" type="number" value="300" min="1" step="50">
    <span style="color:var(--dim)">按度数取前 N</span>
  </div>
  <div class="row">
    <label>着色</label>
    <div class="seg" style="flex:1">
      <button id="byCommunity" class="on">社区</button>
      <button id="byKind">类型</button>
    </div>
  </div>
  <div class="row">
    <label>标签</label>
    <input id="showLabels" type="checkbox" checked>
    <span style="color:var(--dim)">悬停看全文</span>
  </div>
  <div id="stats">—</div>
</div>

<div class="panel" id="detail"></div>
<div class="panel" id="legend"></div>
<div id="msg"></div>

<script src="/viz/vendor/3d-force-graph.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const msg = (t) => { $('msg').textContent = t || ''; };

  // Palette from an integer (community id, kind hash): golden-angle hue, fixed
  // saturation/lightness so no two boxes look alike and none of them shouts.
  const hue = (n) => {
    const h = (n * 137.508) % 360;
    return `hsl(${h.toFixed(1)} 62% 62%)`;
  };
  const hash = (s) => {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return Math.abs(h);
  };
  // A literal entity is a NUMBER, not a typed node: the type label is numeric
  // (LITERAL_KIND), so the picture says so instead of colouring it like a class.
  const isLiteral = (n) => n.literal_num !== null && n.literal_num !== undefined && n.kind === '';

  let graphData = { nodes: [], links: [] };
  let nodeById = new Map();
  let degree = new Map();
  let colourBy = 'community';
  let selected = null, neighbours = new Set();

  const nodeColour = (n) => {
    if (colourBy === 'kind') {
      if (isLiteral(n)) return '#94a3b8';
      return hue(hash(n.kind || 'other'));
    }
    return hue(n.community_id === null || n.community_id === undefined ? 0 : n.community_id);
  };
  // The hover card: title, the text the node carries, where it came from, then
  // whatever else the writer attached. Multi-line by construction — a card that
  // puts a sentence and five attributes on one line is a tooltip nobody reads.
  const escapeHtml = (s) => String(s ?? '').replace(/[&<>"]/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const HIDDEN_PROPS = new Set(['title', 'content', 'source', 'blurb', 'blurb_en',
    'url', 'path', 'doc', 'key', 'slug']);
  const nodeLabel = (n) => {
    const p = n.props || {};
    const title = p.title || n.name || `#${n.id}`;
    const rows = [`<div class="cd-title">${escapeHtml(title)}</div>`];
    if (n.name && n.name !== title) rows.push(`<div class="cd-name">${escapeHtml(n.name)}</div>`);
    if (p.content) rows.push(`<div class="cd-body">${escapeHtml(p.content)}</div>`);
    const meta = [isLiteral(n) ? `字面量 ${n.literal_num}` : `类型 ${n.kind || '（无）'}`,
      `社区 ${n.community_id ?? '—'}`, `度数 ${degree.get(n.id) ?? 0}`];
    if (p.lang) meta.push(`语言 ${p.lang}`);
    rows.push(`<div class="cd-meta">${escapeHtml(meta.join(' · '))}</div>`);
    if (p.source) rows.push(`<div class="cd-src">来源 ${escapeHtml(p.source)}</div>`);
    const rest = Object.entries(p).filter(([k]) => !HIDDEN_PROPS.has(k));
    if (rest.length) {
      rows.push('<div class="cd-props">'
        + rest.map(([k, v]) => `<span>${escapeHtml(k)}</span> ${escapeHtml(
          typeof v === 'object' ? JSON.stringify(v) : v)}`).join('<br>')
        + '</div>');
    }
    return rows.join('');
  };
  const radius = (n) => 1.2 + Math.min(6, Math.sqrt(degree.get(n.id) || 1) * 0.9);
  // The wire carries the weight as the SCALED integer the core stores
  // (WEIGHT_SCALE 1000): a weight of 347 is 0.347, and showing "347" in a
  // tooltip is how a viewer teaches its reader the wrong number.
  const WEIGHT_SCALE = 1000;
  const weight = (w) => ((w ?? 0) / WEIGHT_SCALE).toFixed(3);

  const Graph = ForceGraph3D()($('graph'))
    .backgroundColor('rgba(0,0,0,0)')
    .showNavInfo(false)
    .nodeRelSize(1)
    .nodeVal(n => Math.pow(radius(n), 3))
    .nodeColor(n => (selected && n.id !== selected.id && !neighbours.has(n.id)) ? '#33415f' : nodeColour(n))
    .nodeLabel(nodeLabel)
    .linkColor(l => (selected && (l.source.id === selected.id || l.target.id === selected.id))
      ? '#ffd479' : '#3a4a72')
    .linkWidth(l => (selected && (l.source.id === selected.id || l.target.id === selected.id)) ? 1.6 : 0.4)
    .linkDirectionalArrowLength(3)
    .linkDirectionalArrowRelPos(1)
    .linkLabel(l => `<div class="cd-title">${escapeHtml(l.kind)}</div>`
      + `<div class="cd-body">${escapeHtml(l.source.name ?? '#' + l.source.id)}<br>→ `
      + `${escapeHtml(l.target.name ?? '#' + l.target.id)}</div>`
      + `<div class="cd-meta">w${weight(l.weight)}`
      + (l.since ? ` · since ${l.since}` : '') + `</div>`)
    .onNodeClick(selectNode)
    .onBackgroundClick(() => selectNode(null));

  // ---- labels, drawn on a 2D canvas over the WebGL one -------------------
  //
  // Short on the canvas, full text on hover (nodeLabel / linkLabel above). The
  // one-per-cell rule is what keeps a capped-but-still-dense picture readable:
  // a label that would land on top of another one is DROPPED, and what gets
  // dropped is the low-degree end — the selection and its neighbours always win.
  const SHORT_NODE = 16, SHORT_LINK = 13;
  const truncate = (text, max) => {
    const t = (text || '').replace(/\s+/g, ' ').trim();
    return t.length > max ? t.slice(0, max - 1) + '…' : t;
  };
  const labelCanvas = $('labels');
  const labelCtx = labelCanvas.getContext('2d');
  let labelDpr = 1;
  function sizeLabels() {
    labelDpr = window.devicePixelRatio || 1;
    labelCanvas.width = Math.floor(window.innerWidth * labelDpr);
    labelCanvas.height = Math.floor(window.innerHeight * labelDpr);
    labelCanvas.style.width = window.innerWidth + 'px';
    labelCanvas.style.height = window.innerHeight + 'px';
  }
  // The engine draws only when something moves, so the overlay keeps its own
  // clock: every frame would burn a core for text nobody moved, and a slow
  // timer makes the words lag behind the dots.
  let lastLabelDraw = 0;
  function drawLabels(now) {
    requestAnimationFrame(drawLabels);
    if (now - lastLabelDraw < 80) return;
    lastLabelDraw = now;
    labelCtx.setTransform(labelDpr, 0, 0, labelDpr, 0, 0);
    labelCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    if (!graphData.nodes.length || !$('showLabels').checked) return;
    const project = (p) => {
      if (!Number.isFinite(p.x) || !Number.isFinite(p.y)) return null;
      const at = Graph.graph2ScreenCoords(p.x, p.y, p.z);
      if (!at || !Number.isFinite(at.x) || !Number.isFinite(at.y)) return null;
      if (at.x < 0 || at.y < 0 || at.x > window.innerWidth || at.y > window.innerHeight) return null;
      return at;
    };
    const taken = new Set();
    const free = (x, y) => {
      const key = `${Math.floor(x / 96)}:${Math.floor(y / 15)}`;
      if (taken.has(key)) return false;
      taken.add(key);
      return true;
    };
    labelCtx.font = '10px ui-monospace, Menlo, Consolas, monospace';
    labelCtx.textAlign = 'center';
    labelCtx.textBaseline = 'middle';
    const ranked = [...graphData.nodes].sort((a, b) => {
      const weightOf = (n) => (selected && (n.id === selected.id || neighbours.has(n.id)) ? 1 : 0);
      return weightOf(b) - weightOf(a) || (degree.get(b.id) || 0) - (degree.get(a.id) || 0);
    });
    for (const node of ranked) {
      const at = project(node);
      if (!at) continue;
      const isSelected = selected && node.id === selected.id;
      if (!free(at.x, at.y + 9) && !isSelected) continue;
      // The TITLE, not the identity: a name like "ADR-0005: Weight System —
      // Counters on the Edge Row" spends its first characters on a badge.
      const shown = (node.props && node.props.title) || node.name || `#${node.id}`;
      labelCtx.fillStyle = isSelected ? '#ffd479' : 'rgba(219,228,255,.78)';
      labelCtx.fillText(truncate(shown, SHORT_NODE), at.x, at.y + 9);
    }
    labelCtx.font = '9px ui-monospace, Menlo, Consolas, monospace';
    for (const link of graphData.links) {
      const { source: s, target: t } = link;
      if (!Number.isFinite(s.x) || !Number.isFinite(t.x)) continue;
      const at = project({ x: (s.x + t.x) / 2, y: (s.y + t.y) / 2, z: (s.z + t.z) / 2 });
      if (!at || !free(at.x, at.y)) continue;
      const touch = selected && (s.id === selected.id || t.id === selected.id);
      labelCtx.fillStyle = touch ? 'rgba(255,212,121,.9)' : 'rgba(139,154,196,.6)';
      labelCtx.fillText(truncate(link.kind, SHORT_LINK), at.x, at.y);
    }
  }
  sizeLabels();
  requestAnimationFrame(drawLabels);

  function recount() {
    degree = new Map();
    graphData.nodes.forEach(n => degree.set(n.id, 0));
    graphData.links.forEach(l => {
      const s = l.source.id ?? l.source, t = l.target.id ?? l.target;
      if (degree.has(s)) degree.set(s, degree.get(s) + 1);
      if (degree.has(t)) degree.set(t, degree.get(t) + 1);
    });
  }

  function selectNode(node) {
    selected = node;
    neighbours = new Set();
    if (node) {
      graphData.links.forEach(l => {
        const s = l.source.id ?? l.source, t = l.target.id ?? l.target;
        if (s === node.id) neighbours.add(t);
        if (t === node.id) neighbours.add(s);
      });
    }
    Graph.nodeColor(Graph.nodeColor());
    showDetail(node);
  }

  function showDetail(node) {
    const box = $('detail');
    if (!node) { box.style.display = 'none'; return; }
    const incident = graphData.links.filter(l =>
      (l.source.id ?? l.source) === node.id || (l.target.id ?? l.target) === node.id);
    const head = document.createElement('div');
    head.innerHTML = '';
    const h = document.createElement('h2');
    const props = node.props || {};
    h.textContent = props.title || node.name || `#${node.id}`;
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `${isLiteral(node) ? '字面量 ' + node.literal_num : '类型 ' + (node.kind || '（无）')}`
      + ` · 社区 ${node.community_id ?? '—'} · ${incident.length} 条边`;
    // The same three things the hover card shows, kept on screen while the
    // reader follows edges: what it is called, what it says, where it came from.
    const extra = [];
    if (node.name && node.name !== h.textContent) {
      const id = document.createElement('div');
      id.className = 'meta';
      id.style.wordBreak = 'break-all';
      id.textContent = node.name;
      extra.push(id);
    }
    if (props.content) {
      const body = document.createElement('div');
      body.className = 'body';
      body.textContent = props.content;
      extra.push(body);
    }
    if (props.source) {
      const src = document.createElement('div');
      src.className = 'meta';
      src.style.wordBreak = 'break-all';
      src.textContent = `来源 ${props.source}`;
      extra.push(src);
    }
    const ul = document.createElement('ul');
    incident
      .map(l => {
        const out = (l.source.id ?? l.source) === node.id;
        return { l, out };
      })
      .sort((a, b) => (b.l.weight ?? 0) - (a.l.weight ?? 0))
      .forEach(({ l, out }) => {
        const otherId = out ? (l.target.id ?? l.target) : (l.source.id ?? l.source);
        const other = nodeById.get(otherId);
        const li = document.createElement('li');
        const rel = document.createElement('span');
        rel.className = 'rel';
        rel.textContent = out ? `${l.kind} → ` : `← ${l.kind} `;
        const end = document.createElement('span');
        end.className = 'end';
        end.textContent = other ? (other.name || `#${otherId}`) : `#${otherId}`;
        const w = document.createElement('span');
        w.className = 'w';
        w.textContent = `  w${weight(l.weight)}`;
        li.append(rel, end, w);
        // Walking the graph from inside the panel: the edge list is the
        // navigation, not an appendix to it.
        li.onclick = () => { if (other) selectNode(other); };
        ul.appendChild(li);
      });
    box.replaceChildren(h, meta, ...extra, ul);
    box.style.display = 'block';
  }

  function applyCap(allNodes, allLinks, cap) {
    const live = new Map();
    allLinks.forEach(l => {
      const s = l.source, t = l.target;
      live.set(s, (live.get(s) || 0) + 1);
      live.set(t, (live.get(t) || 0) + 1);
    });
    const kept = [...allNodes]
      .sort((a, b) => (live.get(b.id) || 0) - (live.get(a.id) || 0) || (a.id - b.id))
      .slice(0, cap);
    const keep = new Set(kept.map(n => n.id));
    const nodes = kept.map(n => ({ ...n }));
    nodeById = new Map(nodes.map(n => [n.id, n]));
    // Resolve endpoints BEFORE handing the array to the engine: a link whose
    // endpoints are still strings makes the physics tick read undefined
    // coordinates and throws inside the animation loop, which freezes the
    // canvas (the library only re-arms requestAnimationFrame at the end).
    const links = [];
    let dropped = 0;
    allLinks.forEach(l => {
      const s = keep.has(l.source) ? nodeById.get(l.source) : null;
      const t = keep.has(l.target) ? nodeById.get(l.target) : null;
      if (!s || !t) { dropped++; return; }
      links.push({ ...l, source: s, target: t });
    });
    return { nodes, links, dropped, total: allNodes.length };
  }

  async function load() {
    const scope = Number($('scope').value);
    const cap = Math.max(1, Number($('cap').value) || 1);
    msg('');
    try {
      const response = await fetch(`/graph/${scope}`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      const { nodes, links, dropped, total } = applyCap(data.nodes || [], data.links || [], cap);
      graphData = { nodes, links };
      selected = null; neighbours = new Set();
      $('detail').style.display = 'none';
      Graph.graphData(graphData);
      recount();
      Graph.nodeColor(Graph.nodeColor());
      renderLegend();
      $('stats').textContent = `节点 ${nodes.length}/${total} · 边 ${links.length}`
        + (dropped ? ` · 上限外 ${dropped} 条边` : '');
    } catch (e) {
      msg(`读 /graph/${scope} 失败：${e.message}`);
    }
  }

  function renderLegend() {
    const box = $('legend');
    if (colourBy === 'kind') {
      const kinds = new Map();
      graphData.nodes.forEach(n => {
        const key = isLiteral(n) ? '（字面量）' : (n.kind || '（无）');
        kinds.set(key, (kinds.get(key) || 0) + 1);
      });
      const items = [...kinds.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10);
      box.replaceChildren(...items.map(([k, n]) => {
        const row = document.createElement('div');
        row.className = 'item';
        const sw = document.createElement('span');
        sw.className = 'sw';
        sw.style.background = k === '（字面量）' ? '#94a3b8' : hue(hash(k));
        const tx = document.createElement('span');
        tx.textContent = `${k} · ${n}`;
        row.append(sw, tx);
        return row;
      }));
      box.style.display = items.length ? 'block' : 'none';
    } else {
      const communities = new Map();
      graphData.nodes.forEach(n => {
        const key = n.community_id ?? -1;
        communities.set(key, (communities.get(key) || 0) + 1);
      });
      const items = [...communities.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10);
      box.replaceChildren(...items.map(([k, n]) => {
        const row = document.createElement('div');
        row.className = 'item';
        const sw = document.createElement('span');
        sw.className = 'sw';
        sw.style.background = hue(k < 0 ? 0 : k);
        const tx = document.createElement('span');
        tx.textContent = `${k < 0 ? '未分箱' : '社区 ' + k} · ${n}`;
        row.append(sw, tx);
        return row;
      }));
      box.style.display = items.length ? 'block' : 'none';
    }
  }

  $('load').onclick = load;
  $('cap').onchange = load;
  $('byCommunity').onclick = () => {
    colourBy = 'community';
    $('byCommunity').classList.add('on'); $('byKind').classList.remove('on');
    Graph.nodeColor(Graph.nodeColor()); renderLegend();
  };
  $('byKind').onclick = () => {
    colourBy = 'kind';
    $('byKind').classList.add('on'); $('byCommunity').classList.remove('on');
    Graph.nodeColor(Graph.nodeColor()); renderLegend();
  };
  window.addEventListener('resize', () => {
    Graph.width(window.innerWidth).height(window.innerHeight);
    sizeLabels();
  });
  load();
</script>
</body>
</html>
